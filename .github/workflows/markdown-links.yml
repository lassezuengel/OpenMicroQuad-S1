name: Markdown links

on:
  # Run for all changes: moving a linked file can break an unchanged README.
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-links:
    name: Check Markdown links
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check links and images in Markdown
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2
        with:
          lycheeVersion: v0.24.2
          args: >-
            --root-dir "${{ github.workspace }}"
            --include-fragments
            --timeout 20
            --max-retries 3
            --verbose
            --no-progress
            './**/*.md'
          fail: true
          failIfEmpty: true
          jobSummary: true
